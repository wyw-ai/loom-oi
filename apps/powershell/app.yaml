version: 1
app:
  code: powershell
runtime:
  command: [./runtime/oiapp-powershell.exe]
actions:
  exec_command:
    description: Start one PowerShell 7 execution and return output with a session handle or exit code.
    input_schema:
      type: object
      properties:
        cmd: {type: string}
        workdir: {type: string}
        tty: {type: boolean, default: false}
        yield_time_ms: {type: integer, default: 10000}
        max_output_tokens: {type: integer, default: 10000}
      required: [cmd]
  write_stdin:
    description: Read pending output or write terminal input for an existing PowerShell execution.
    input_schema:
      type: object
      properties:
        session_id: {type: string}
        chars: {type: string, default: ''}
        yield_time_ms: {type: integer}
        max_output_tokens: {type: integer, default: 10000}
      required: [session_id]
