# P1 quality signals (B4 §5): four-platform CGO_ENABLED=0 builds, vet,
# staticcheck, govulncheck, unit tests with the ≥95% coverage gate and the
# race detector against PostgreSQL 18.6, fuzzing, the B1–B4 vectors on both
# backends, repository Python checks, and Windows build/unit/F0 checks.
name: ci

on:
  push:
    branches: [alpha, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  FUZZ_TIME: 60s

jobs:
  build-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod verify
      - name: Check fixed local WebSocket source
        run: python -c "from pathlib import Path; from experiments.product import dependency_quality as d; d.source_fact(Path.cwd())"
      - name: Build linux/amd64, linux/arm64, windows/amd64, darwin/arm64
        run: |
          for p in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -trimpath -o "out/${p%/*}-${p#*/}/" ./cmd/...
          done
          ls -lR out
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal tests)"
      - run: go vet ./...
      - run: go -C third_party/websocket vet ./...
      - name: staticcheck v0.8.2
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go -C third_party/websocket run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Check the fixed WebSocket upstream version
        run: |
          mkdir -p coverage
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -json -mode=query github.com/coder/websocket@v1.8.15 > coverage/websocket-vuln.json
          python -c "from pathlib import Path; from experiments.product import dependency_quality as d; d.validate_query(Path('coverage/websocket-vuln.json').read_text())"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: websocket-vulnerability-query
          path: coverage/websocket-vuln.json
          if-no-files-found: ignore

  unit:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      OI_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests with coverage (TASK-004 fixed command)
        run: |
          mkdir -p coverage
          go test -count=1 -covermode=atomic -coverprofile=coverage/unit.out ./cmd/... ./internal/...
          go tool cover -func=coverage/unit.out > coverage/func.txt
          tail -n 1 coverage/func.txt
      - name: Complete local WebSocket module tests
        run: |
          CGO_ENABLED=1 GODEBUG=netdns=cgo+1 RES_OPTIONS='attempts:1 timeout:1' go -C third_party/websocket test -json -p=1 -count=1 -covermode=atomic -coverprofile="$GITHUB_WORKSPACE/coverage/dependency.out" ./... > coverage/dependency-unit.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.product import dependency_quality as d
          events = [dict(step='dependency-unit', kind='go', event=json.loads(line)) for line in Path('coverage/dependency-unit.jsonl').read_text().splitlines()]
          d._go_tests(events, 'dependency-unit')
          PY
      - name: Coverage gate (≥95% of the complete P1 delivery unit)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.product import dependency_quality as d
          d.source_fact(Path.cwd())
          coverage = d.summarize_coverage(Path('coverage/unit.out').read_text(), Path('coverage/dependency.out').read_text())
          print(json.dumps(coverage, indent=2))
          assert coverage['meets_threshold']
          PY
      - name: Race detector
        run: |
          go test -race -count=1 ./cmd/... ./internal/...
          CGO_ENABLED=1 GODEBUG=netdns=cgo+1 RES_OPTIONS='attempts:1 timeout:1' go -C third_party/websocket test -json -p=1 -race -count=1 ./... > coverage/dependency-race.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.product import dependency_quality as d
          events = [dict(step='dependency-race', kind='go', event=json.loads(line)) for line in Path('coverage/dependency-race.jsonl').read_text().splitlines()]
          d._go_tests(events, 'dependency-race')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fuzz tunnel frames
        run: go test -run '^$' -fuzz '^FuzzDecodeFrame$' -fuzztime "$FUZZ_TIME" ./internal/protocol
      - name: Fuzz control messages
        run: go test -run '^$' -fuzz '^FuzzDecodeControl$' -fuzztime "$FUZZ_TIME" ./internal/protocol
      - name: Fuzz observation lifetime and stale-work isolation
        run: go test -run '^$' -fuzz '^FuzzObservationState$' -fuzztime "$FUZZ_TIME" ./internal/observation

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      OI_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      OI_IT: "1"
      OI_IT_BACKENDS: sqlite,postgres
      OI_IT_RUNDIR: ${{ github.workspace }}/it-run
    steps:
      - uses: actions/checkout@v7
        with:
          # G2-13 builds the exact adopted P1 commit for real compatibility.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Small file system for the disk-full vector (TV-B3-11e)
        run: |
          sudo mkdir -p /mnt/oi-small
          sudo mount -t tmpfs -o size=32m tmpfs /mnt/oi-small
          sudo chown "$(id -u):$(id -g)" /mnt/oi-small
      - name: B1–B4 vectors with the real binaries, P2 recovery included (SQLite and PostgreSQL 18.6)
        env:
          # pg_dump/pg_restore of the server's own version run inside the
          # service container (TV-B3-11a/b/c).
          OI_IT_PG_CONTAINER: ${{ job.services.postgres.id }}
          OI_IT_SMALLFS: /mnt/oi-small
        run: |
          set -o pipefail
          mkdir -p "$OI_IT_RUNDIR"
          go test -count=1 -timeout 90m -v ./tests/integration 2>&1 | tee "$OI_IT_RUNDIR/integration.log"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-logs
          path: it-run/

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Retired evidence references use an exact pre-cleanup Git commit.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repository checks
        run: |
          python experiments/check_gates.py --stage P2
          python experiments/check_iterations.py
          python experiments/check_materials.py
          python -m unittest discover -s experiments -p 'test_*.py'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Retired evidence references use an exact pre-cleanup Git commit.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: go build ./...
      - name: Unit tests (PostgreSQL cases skip without OI_TEST_PG_DSN)
        run: go test -count=1 ./cmd/... ./internal/...
      - name: Local WebSocket module unit tests
        run: go -C third_party/websocket test -count=1 ./...
      - name: Python checks in the default code page, without PYTHONUTF8 (F0, TV-B4-02)
        shell: cmd
        run: |
          python experiments/check_gates.py --stage P2 || exit /b 1
          python experiments/check_iterations.py || exit /b 1
          python experiments/check_materials.py || exit /b 1
          python -m unittest discover -s experiments -p "test_*.py" || exit /b 1
