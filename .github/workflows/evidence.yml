# Product evidence (experiments/GATES.md): pushing evidence/<ID> at the
# commit to test runs the preregistered experiments/manifests/<ID>.json
# (G1-P1, G4-P2, ...) with experiments/product/run.py on Linux with
# PostgreSQL 18.6, and uploads the run directory. The run is reviewed and
# committed under experiments/runs before any gate is recorded (dispatch
# needs the workflow on the default branch).
name: evidence

on:
  push:
    branches: ["evidence/**", "!evidence/G2-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    if: ${{ !startsWith(github.ref, 'refs/heads/evidence/G2-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      OI_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      OI_PG_IMAGE: postgres:18.6
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Small file system for the disk-full vector (TV-B3-11e)
        run: |
          sudo mkdir -p /mnt/oi-small
          sudo mount -t tmpfs -o size=32m tmpfs /mnt/oi-small
          sudo chown "$(id -u):$(id -g)" /mnt/oi-small
      - name: Run the preregistered evidence named by the branch
        env:
          # pg_dump/pg_restore of the server's own version (TV-B3-11a/b/c).
          OI_IT_PG_CONTAINER: ${{ job.services.postgres.id }}
          OI_IT_SMALLFS: /mnt/oi-small
        run: python experiments/product/run.py "experiments/manifests/${GITHUB_REF_NAME#evidence/}.json" --output-root evidence --work evidence-work
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence
          path: evidence/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: evidence-work
          path: evidence-work/
