name: g2-clock

on:
  push:
    branches: ["clock/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clock:
    # This ordinary hosted label gives this job its own disposable VM. Never
    # substitute self-hosted or the single-CPU container runner here.
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      OI_IT: "1"
      OI_IT_CLOCK: "1"
      OI_IT_BACKENDS: sqlite,postgres
      OI_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      OI_PG_IMAGE: postgres:18.6
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare all tools and binaries before any clock change
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g2-clock/bin" "$RUNNER_TEMP/g2-clock/artifacts/work"
          python -m unittest experiments/test_clock_guard.py
          go mod download
          go test -c -o "$RUNNER_TEMP/g2-clock/integration.test" ./tests/integration
          for command in ois oic oi; do
            CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/g2-clock/bin/$command" "./cmd/$command"
          done
          python - <<'PY'
          import hashlib,json,os,pathlib,secrets,subprocess
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'g2-clock'
          nonce=secrets.token_hex(32)
          fd=os.open(base/'nonce',os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'w') as f:f.write(nonce+'\n')
          sources={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if pathlib.Path(p).is_file()}
          preparation=dict(source_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],workflow_ref=os.environ['GITHUB_WORKFLOW_REF'],runner_environment=os.environ['RUNNER_ENVIRONMENT'],runner_os=os.environ['RUNNER_OS'],nonce_sha256=hashlib.sha256(nonce.encode()).hexdigest(),source_hashes=sources,go_version=subprocess.check_output(['go','version'],text=True).strip(),uname=subprocess.check_output(['uname','-a'],text=True).strip(),binaries={str(p.relative_to(base)):hashlib.sha256(p.read_bytes()).hexdigest() for p in [base/'integration.test',*(base/'bin').iterdir()]})
          (base/'artifacts/preparation.json').write_text(json.dumps(preparation,sort_keys=True,indent=2)+'\n')
          PY
      - name: Run only the real-clock matrix under the restricted guard
        shell: bash
        run: |
          set -euo pipefail
          export OI_IT_BIN="$RUNNER_TEMP/g2-clock/bin"
          export OI_IT_RUNDIR="$RUNNER_TEMP/g2-clock/artifacts/work"
          sudo -n --preserve-env=OI_IT,OI_IT_CLOCK,OI_IT_BACKENDS,OI_IT_BIN,OI_IT_RUNDIR,OI_TEST_PG_DSN,OI_PG_IMAGE,GOTOOLCHAIN,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_JOB,GITHUB_REPOSITORY,GITHUB_WORKFLOW_REF,GITHUB_RUN_ID,GITHUB_SHA \
            python3 experiments/product/clock_guard.py run \
            --uid "$(id -u)" --gid "$(id -g)" --parent-pid "$$" \
            --nonce-file "$RUNNER_TEMP/g2-clock/nonce" --go "$(command -v go)" \
            --binary "$RUNNER_TEMP/g2-clock/integration.test" --work "$GITHUB_WORKSPACE" \
            --raw "$RUNNER_TEMP/g2-clock/artifacts/raw.jsonl"
      - name: Always restore and retain the guard audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          nonce_file="$RUNNER_TEMP/g2-clock/nonce"
          if [ ! -f "$nonce_file" ]; then
            echo 'Guard never armed: preparation did not create a nonce.'
            exit 0
          fi
          guard_dir="$(python -c 'import hashlib,pathlib,sys; print("/run/loom-oi-clock-"+hashlib.sha256(pathlib.Path(sys.argv[1]).read_text().strip().encode()).hexdigest()[:24])' "$nonce_file")"
          if ! sudo test -f "$guard_dir/state.json"; then
            echo 'Guard never armed: no privileged restoration anchor exists.'
            exit 0
          fi
          set +e
          sudo -n --preserve-env=OI_IT_CLOCK,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_JOB,GITHUB_REPOSITORY,GITHUB_WORKFLOW_REF,GITHUB_RUN_ID,GITHUB_SHA \
            python3 experiments/product/clock_guard.py recover --uid "$(id -u)" --nonce-file "$nonce_file"
          restore_exit=$?
          set -e
          mkdir -p "$RUNNER_TEMP/g2-clock/artifacts/guard"
          sudo cp "$guard_dir/guard.jsonl" "$guard_dir/state.json" "$RUNNER_TEMP/g2-clock/artifacts/guard/"
          if sudo test -f "$guard_dir/finished.json"; then
            sudo cp "$guard_dir/finished.json" "$RUNNER_TEMP/g2-clock/artifacts/guard/"
          fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/g2-clock/artifacts/guard"
          exit "$restore_exit"
      - name: Require all 20 real leaves and all 400 restored rounds
        if: always()
        shell: bash
        run: |
          python experiments/product/clock_guard.py verify \
            --raw "$RUNNER_TEMP/g2-clock/artifacts/raw.jsonl" \
            --audit "$RUNNER_TEMP/g2-clock/artifacts/guard/guard.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: g2-clock
          path: ${{ runner.temp }}/g2-clock/artifacts/
